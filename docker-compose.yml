services:
  # Records the raw feeds. Nothing else may slow it down or take it out.
  ingest:
    build:
      context: .
      args: { PROJECT: Ingest }
    restart: unless-stopped
    environment:
      Ingest__DataDir: /data
    volumes:
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Derives crossings from the archive into SQLite. Reads data/ only, so a bug here can't touch the recording.
  detect:
    build:
      context: .
      args: { PROJECT: Detect }
    restart: unless-stopped
    environment:
      Detect__DataDir: /data
      Detect__DbPath: /derived/crossings.db
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Scores predictors against observed departures. Not a long-running service: run on demand or by the
  # nightly systemd timer (deploy/transit-backtest.timer) with `docker compose run --rm -T backtest`.
  # The limits live here because the container isn't a child of the systemd unit, so the unit's Nice= wouldn't reach it.
  # The Pi boots with cgroup_disable=memory, so Docker's mem_limit does nothing there: the heap is capped by .NET instead (3 GB, in hex).
  # If the node still runs short of memory, this is what the kernel kills first: a missed score, never a missed recording.
  backtest:
    build:
      context: .
      args: { PROJECT: Backtest }
    profiles: [tools]
    command: ["--data", "/data", "--db", "/derived/crossings.db", "--yesterday", "--live-log", "/derived/live-predictions", "--fit-margins", "/derived/be-by-margins.json"]
    environment:
      DOTNET_GCHeapHardLimit: "0xC0000000"
    cpus: 2.0
    cpu_shares: 128
    oom_score_adj: 1000
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Experiment: the same detection with checkpoints on a shared map grid (see CheckpointBuilder.Mode), into its own
  # database, so both layouts are scored on the same days. Score it with TRANSIT_CHECKPOINTS=grid and --db crossings-grid.db.
  # Off by default: a week in, it scored worse than the spaced layout. Start it with --profile experiments.
  detect-grid:
    profiles: [experiments]
    build:
      context: .
      args: { PROJECT: Detect }
    restart: unless-stopped
    environment:
      TRANSIT_CHECKPOINTS: grid
      Detect__DataDir: /data
      Detect__DbPath: /derived/crossings-grid.db
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Live map and predictions for the LAN: http://<node>:8080
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Api__DataDir: /data
      Api__DbPath: /derived/crossings.db
      Api__BacktestDbPath: /derived/backtest.db
      Api__PredictionLogDir: /derived/live-predictions
      Api__BeByMarginsPath: /derived/be-by-margins.json
    volumes:
      - ./data:/data:ro
      # Read-write because SQLite needs its -shm file to read a WAL database, and for the live prediction log.
      - ./derived:/derived
    logging: *logging
