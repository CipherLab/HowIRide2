services:
  # Records the raw feeds. Nothing else may slow it down or take it out.
  ingest:
    build:
      context: .
      args: { PROJECT: Ingest }
    restart: unless-stopped
    environment:
      Ingest__DataDir: /data
    volumes:
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Derives crossings from the archive into SQLite. Reads data/ only, so a bug here can't touch the recording.
  detect:
    build:
      context: .
      args: { PROJECT: Detect }
    restart: unless-stopped
    environment:
      Detect__DataDir: /data
      Detect__DbPath: /derived/crossings.db
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Scores predictors against observed departures. Not a long-running service: run on demand or by the
  # nightly systemd timer (deploy/transit-backtest.timer) with `docker compose run --rm backtest --yesterday ...`.
  backtest:
    build:
      context: .
      args: { PROJECT: Backtest }
    profiles: [tools]
    command: ["--data", "/data", "--db", "/derived/crossings.db", "--yesterday"]
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Experiment: the same detection with checkpoints on a shared map grid (see CheckpointBuilder.Mode), into its own
  # database, so both layouts are scored on the same days. Score it with TRANSIT_CHECKPOINTS=grid and --db crossings-grid.db.
  detect-grid:
    build:
      context: .
      args: { PROJECT: Detect }
    restart: unless-stopped
    environment:
      TRANSIT_CHECKPOINTS: grid
      Detect__DataDir: /data
      Detect__DbPath: /derived/crossings-grid.db
    volumes:
      - ./data:/data:ro
      - ./derived:/derived
    logging: *logging

  # Live map and predictions for the LAN: http://<node>:8080
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Api__DataDir: /data
      Api__DbPath: /derived/crossings.db
      Api__BacktestDbPath: /derived/backtest.db
    volumes:
      - ./data:/data:ro
      # Read-write only because SQLite needs its -shm file to read a WAL database; the API never writes.
      - ./derived:/derived
    logging: *logging
